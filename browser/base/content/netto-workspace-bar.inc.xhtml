      <toolbaritem id="netto-workspace-bar"
                   class="chromeclass-toolbar-additional"
                   removable="false"
                   overflows="false">
        <hbox id="netto-workspace-indicators"
              role="tablist"
              data-l10n-id="netto-workspace-bar"
              data-l10n-attrs="aria-label"
              align="center"/>
      </toolbaritem>
      <menupopup id="netto-workspace-context-menu">
        <menuitem id="netto-workspace-rename"
                  data-l10n-id="netto-workspace-rename"/>

                  data-l10n-id="netto-workspace-close"/>
      </menupopup>
